[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["startup", "certs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E501"]  # allow long lines in test fixtures/assertions
